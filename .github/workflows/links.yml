name: Link check

# Monthly cron that runs lychee across the repo's markdown + HTML +
# source-file URL literals to catch external-link rot before a visitor
# does. Warn-only: creates a GitHub issue when links break, doesn't fail
# CI or block merges. Broken external links (LinkedIn migrations, GitHub
# repo renames, CV mirror moves) are a signal to update, not a merge
# blocker.
#
# Not run per-PR because the internet's rate limits and transient
# failures would produce false-positive noise on unrelated changes.
# Monthly cadence catches the class of rot we actually care about — a
# link that was fine when merged but died between then and now.
#
# Manual trigger via workflow_dispatch when you want to check now.

on:
  schedule:
    # 08:00 UTC on the 1st of each month.
    - cron: '0 8 1 * *'
  workflow_dispatch:

permissions:
  # Needed for `--create-issue` in the lychee action.
  issues: write
  contents: read

jobs:
  link-check:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Config file at .lycheerc.toml controls what's scanned and
          # what gets excluded (localhost, feature-flag prod URLs, etc.).
          # --root-dir resolves root-relative local links (e.g. CSS
          # `url(/fonts/...)`) against public/, the actual static-asset
          # root — without it lychee can't verify those and errors on
          # every one instead of catching real typos.
          args: >-
            --config .lycheerc.toml
            --root-dir ${{ github.workspace }}/public
            --no-progress
            .
          fail: false
          # Post any newly-broken links to a GitHub issue instead of
          # tanking the workflow — see docstring above.
          format: markdown
          output: lychee-report.md

      - name: Find existing tracking issue
        # peter-evans/create-issue-from-file always creates a new issue
        # unless told which one to update via `issue-number` — it doesn't
        # dedupe by title on its own. Look up any already-open issue with
        # our well-known title so the next step updates it in place
        # instead of piling up a new issue every month.
        if: steps.lychee.outputs.exit_code != '0'
        id: existing-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search 'in:title "Broken links found by monthly lychee scan"' \
            --json number \
            --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Create issue on breakage
        # Only opens/updates an issue if lychee actually reported errors.
        # Reuses a well-known issue title so we don't churn out a new
        # issue every month — see "Find existing tracking issue" above.
        if: steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          issue-number: ${{ steps.existing-issue.outputs.number }}
          title: 'Broken links found by monthly lychee scan'
          content-filepath: ./lychee-report.md
          labels: |
            report
            automated-issue
