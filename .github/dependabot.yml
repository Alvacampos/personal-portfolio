version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Group related ecosystems into single PRs so Dependabot opens
    # roughly one PR per ecosystem per week instead of 5+ per day.
    groups:
      react-router:
        patterns:
          - "react-router"
          - "@react-router/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
      stylelint:
        patterns:
          - "stylelint"
          - "stylelint-*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"
      types:
        patterns:
          - "@types/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
    # Deferred majors — Dependabot reopens the same PR every week
    # otherwise. Each entry has a specific reason; revisit when the
    # upstream unblocks.
    ignore:
      # ESLint 10 blocked by three plugins that still cap their eslint
      # peer at ^9 as of 2026-07-03:
      #   - eslint-plugin-import@2.32   (peer: ^2 || ... || ^9)
      #   - eslint-plugin-jsx-a11y@6.10  (peer: ^3 || ... || ^9)
      #   - eslint-plugin-react@7.37     (peer: ^3 || ... || ^9.7)
      # eslint-plugin-react-hooks@7.x and typescript-eslint@8.x already
      # widened to ^10, so this comes down to those three. Revisit when
      # any of them ships a release that accepts eslint@10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # react-dom@19.3.0 adds ~8.8 kB gzipped to the entry.client chunk
      # over 19.2.7 (measured 2026-09-17: 58.12 kB -> 66.94 kB, blowing
      # the 62 kB size-limit budget on its own). Unclear yet whether
      # that's new hydration/Actions machinery shipping unconditionally
      # or something tree-shakeable we're missing. Revisit once the
      # cause is understood — either fix the import to shake it out, or
      # deliberately raise .size-limit.json's entry.client budget and
      # unblock this.
      - dependency-name: "react"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
